<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sample Contact Form</title></head>
<body>
  <h1>Contact us</h1>
  <form>
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" value="Ada Lovelace">
    <label>Email <input name="email" type="email" value="ada@example.test"></label>
    <textarea aria-label="Message">Hello</textarea>
    <button type="submit">Send message</button>
  </form>
</body>
</html>
