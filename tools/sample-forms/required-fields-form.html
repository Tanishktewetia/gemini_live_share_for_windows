<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Required Fields Form</title></head>
<body>
  <h1>Registration</h1>
  <form>
    <label for="first-name">First name</label>
    <input id="first-name" required value="Grace">
    <label for="last-name">Last name</label>
    <input id="last-name" aria-required="true" value="Hopper">
    <label for="country">Country</label>
    <select id="country"><option>United States</option></select>
  </form>
</body>
</html>
